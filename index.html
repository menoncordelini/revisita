        // Lê o arquivo CSV e cria a lista de territórios automaticamente
        async function carregarCSV() {
            try {
                const resposta = await fetch('Revisita4.csv');
                const texto = await resposta.text();
                const linhas = texto.trim().split('\n');

                // Limpa os arrays
                dadosCSV = [];
                const territoriosTemp = new Set(); // Set = lista sem repetições

                // Pula a primeira linha (cabeçalho)
                for (let i = 1; i < linhas.length; i++) {
                    const partes = linhas[i].split(',');
                    if (partes.length >= 2) {
                        const terr = (partes[0] || '').trim().toUpperCase();
                        const end = (partes[1] || '').trim();
                        const num = (partes[2] || '').trim();
                        const obs = (partes[3] || '').trim();

                        // Adiciona ao array de dados
                        dadosCSV.push({
                            id: i - 1,
                            territorio: terr,
                            endereco: end,
                            numeros: num,
                            obs: obs
                        });

                        // Adiciona o território ao Set (evita duplicatas)
                        if (terr) territoriosTemp.add(terr);
                    }
                }

                territorios = Array.from(territoriosTemp).sort((a, b) => {
                    const numA = parseInt(a.match(/\d+/)?.[0] || 0);
                    const numB = parseInt(b.match(/\d+/)?.[0] || 0);
                    const letraA = a.match(/[A-Z]+/)?.[0] || '';
                    const letraB = b.match(/[A-Z]+/)?.[0] || '';
                    if (numA !== numB) return numA - numB;
                    return letraA.localeCompare(letraB);
                });

                console.log('CSV carregado:', dadosCSV.length, 'registros');
                console.log('Territórios encontrados:', territorios);

                document.getElementById('encodingInfo').textContent = 
                    'Encoding detectado: ' + encodingDetectado + ' | ' + dadosCSV.length + ' registros | ' + territorios.length + ' territorios';

                if (territorios.length > 0) {
                    territorioAtual = territorios[0];
                    document.getElementById('campoTerritorio').value = territorioAtual;
                }

                mostrarStatus('✅ CSV carregado (' + encodingDetectado + '): ' + dadosCSV.length + ' registros', 'sucesso');

            } catch (erro) {
                console.error('Erro ao carregar CSV:', erro);
                mostrarStatus('❌ Erro ao carregar Revisita4.csv', 'erro');
            }
        }

        // ==========================================
        // FUNCAO AUXILIAR: Parse de linha CSV
        // ==========================================
        function parseCSVLine(linha) {
            const resultado = [];
            let atual = '';
            let dentroAspas = false;

            for (let i = 0; i < linha.length; i++) {
                const char = linha[i];
                const proximo = linha[i + 1];

                if (char === '"') {
                    if (dentroAspas && proximo === '"') {
                        atual += '"';
                        i++;
                    } else {
                        dentroAspas = !dentroAspas;
                    }
                } else if (char === ',' && !dentroAspas) {
                    resultado.push(atual.trim());
                    atual = '';
                } else {
                    atual += char;
                }
            }
            resultado.push(atual.trim());
            return resultado;
        }

                const chave = criarChave(reg.territorio, reg.endereco);

                // Checkbox (coluna 1 - visivel no PC, escondido no mobile)

                tdCheck.className = 'coluna-checkbox';

                checkbox.type = 'checkbox';
                checkbox.className = 'checkbox-selecao checkbox-pc';
                checkbox.checked = (idx === indiceSelecionado);
                checkbox.onclick = () => selecionarLinha(idx);
                tdCheck.appendChild(checkbox);
                tr.appendChild(tdCheck);

                // Territorio (com checkbox embutido para mobile)
                const tdTerr = document.createElement('td');
                tdTerr.className = 'coluna-territorio';

                // Checkbox para mobile (dentro da celula de territorio)
                const checkboxMobile = document.createElement('input');
                checkboxMobile.type = 'checkbox';
                checkboxMobile.className = 'checkbox-selecao checkbox-mobile';
                checkboxMobile.checked = (idx === indiceSelecionado);
                checkboxMobile.onclick = () => selecionarLinha(idx);
                tdTerr.appendChild(checkboxMobile);

                // Texto do territorio
                const spanTerr = document.createElement('span');
                spanTerr.className = 'texto-celula';
                spanTerr.textContent = reg.territorio;
                tdTerr.appendChild(spanTerr);

                tr.appendChild(tdTerr);

                // Endereco
                const tdEnd = document.createElement('td');
                tdEnd.textContent = reg.endereco;
                tr.appendChild(tdEnd);

                // Numeros
                const tdNum = document.createElement('td');
                if (modoEdicao && idx === indiceSelecionado) {
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'input-edicao';
                    input.value = numeros;
                    input.maxLength = 60;
                    input.id = 'inputNumeros';
                    tdNum.appendChild(input);
                } else {
                    const span = document.createElement('span');
                    span.className = 'texto-celula';
                    span.textContent = numeros;
                    tdNum.appendChild(span);
                }
                tr.appendChild(tdNum);

                // Observacoes
                const tdObs = document.createElement('td');
                if (modoEdicao && idx === indiceSelecionado) {
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'input-edicao';
                    input.value = obs;
                    input.maxLength = 60;
                    input.id = 'inputObs';
                    tdObs.appendChild(input);
                } else {
                    const span = document.createElement('span');
                    span.className = 'texto-celula';
                    span.textContent = obs;
                    tdObs.appendChild(span);
                }
                tr.appendChild(tdObs);

                corpo.appendChild(tr);
            });
        }

        // ==========================================
        // SELECIONAR LINHA
        // ==========================================
        function selecionarLinha(idx) {
            indiceSelecionado = idx;
            modoEdicao = false;
            document.getElementById('btnInserir').classList.remove('ativo');
            document.getElementById('btnEditar').classList.remove('ativo');
            renderizarTabela();
        }

        // ==========================================
        // MUDAR TERRITORIO (SETAS)
        // ==========================================
        function mudarTerritorio(direcao) {
            modoFiltro = false;
            const idxAtual = territorios.indexOf(territorioAtual);
            let novoIdx = idxAtual + direcao;
            if (novoIdx < 0) novoIdx = 0;
            if (novoIdx >= territorios.length) novoIdx = territorios.length - 1;
            territorioAtual = territorios[novoIdx];
            indiceSelecionado = -1;
            document.getElementById('campoTerritorio').value = territorioAtual;
            renderizarTabela();
        }

        // ==========================================
        // CARREGAR TERRITORIO DIGITADO
        // ==========================================
        function carregarTerritorio() {
            modoFiltro = false;
            const valor = document.getElementById('campoTerritorio').value.trim().toUpperCase();
            if (territorios.includes(valor)) {
                territorioAtual = valor;
                indiceSelecionado = -1;
                renderizarTabela();
            } else {
                mostrarStatus('⚠️ Territorio invalido. Disponiveis: ' + territorios.join(', '), 'erro');
                document.getElementById('campoTerritorio').value = territorioAtual;
            }
        }

        // ==========================================
        // INSERIR REGISTRO
        // ==========================================
        function inserirRegistro() {
            if (modoFiltro) {
                mostrarStatus('⚠️ Saia do modo filtro primeiro', 'info');
                return;
            }

            const registros = dadosCSV.filter(r => r.territorio === territorioAtual);
            if (indiceSelecionado < 0 || indiceSelecionado >= registros.length) {
                mostrarStatus('⚠️ Selecione um endereco primeiro (clique no ☑️)', 'info');
                return;
            }

            modoEdicao = true;
            document.getElementById('btnInserir').classList.add('ativo');
            document.getElementById('btnEditar').classList.add('ativo');
            renderizarTabela();
            mostrarStatus('✏️ Modo INSERIR ativo. Adicione caracteres aos campos e clique em GRAVAR', 'info');
        }

        // ==========================================
        // EDITAR REGISTRO
        // ==========================================
        function editarRegistro() {
            const registros = modoFiltro 
                ? dadosCSV.filter(r => r.endereco === enderecoFiltro)
                : dadosCSV.filter(r => r.territorio === territorioAtual);

            if (indiceSelecionado < 0 || indiceSelecionado >= registros.length) {
                mostrarStatus('⚠️ Selecione um endereco primeiro', 'info');
                return;
            }

            modoEdicao = true;
            document.getElementById('btnInserir').classList.add('ativo');
            document.getElementById('btnEditar').classList.add('ativo');
            renderizarTabela();
            mostrarStatus('✏️ Modo EDITAR ativo. Altere os campos e clique em GRAVAR', 'info');
        }

        // ==========================================
        // GRAVAR REGISTRO
        // ==========================================
        function gravarRegistro() {
            if (!modoEdicao) {
                mostrarStatus('⚠️ Clique em INSERIR ou EDITAR primeiro', 'info');
                return;
            }

            const registros = modoFiltro 
                ? dadosCSV.filter(r => r.endereco === enderecoFiltro)
                : dadosCSV.filter(r => r.territorio === territorioAtual);

            const reg = registros[indiceSelecionado];
            const chave = criarChave(reg.territorio, reg.endereco);

            const numeros = document.getElementById('inputNumeros').value.trim();
            const obs = document.getElementById('inputObs').value.trim();

            if (numeros.length > 60 || obs.length > 60) {
                mostrarStatus('⚠️ Maximo 60 caracteres por campo!', 'erro');
                return;
            }

            revisitasRef.child(chave).set({
                territorio: reg.territorio,
                endereco: reg.endereco,
                numeros: numeros,
                obs: obs,
                data: new Date().toISOString()
            }).then(() => {
                modoEdicao = false;
                document.getElementById('btnInserir').classList.remove('ativo');
                document.getElementById('btnEditar').classList.remove('ativo');
                renderizarTabela();  // ← ATUALIZA A TELA: campos voltam a ser texto (não input)
                mostrarStatus('💾 Dados gravados com sucesso!', 'sucesso');
            }).catch(erro => {
                mostrarStatus('❌ Erro ao gravar: ' + erro.message, 'erro');
            });
        }

        // ==========================================
        // EXCLUIR REGISTRO
        // ==========================================
        function excluirRegistro() {
            const registros = modoFiltro 
                ? dadosCSV.filter(r => r.endereco === enderecoFiltro)
                : dadosCSV.filter(r => r.territorio === territorioAtual);

            if (indiceSelecionado < 0 || indiceSelecionado >= registros.length) {
                mostrarStatus('⚠️ Selecione um endereco primeiro', 'info');
                return;
            }

            const reg = registros[indiceSelecionado];
            const chave = criarChave(reg.territorio, reg.endereco);

            if (!confirm('Tem certeza que deseja limpar os campos Numeros e Observacoes?')) {
                return;
            }

            revisitasRef.child(chave).set({
                territorio: reg.territorio,
                endereco: reg.endereco,
                numeros: '',
                obs: '',
                data: new Date().toISOString()
            }).then(() => {
                mostrarStatus('🗑️ Campos excluidos!', 'sucesso');
            }).catch(erro => {
                mostrarStatus('❌ Erro: ' + erro.message, 'erro');
            });
        }

        // ==========================================
        // FILTRAR ENDERECO
        // ==========================================
        function filtrarEndereco() {
            const registros = dadosCSV.filter(r => r.territorio === territorioAtual);

            if (indiceSelecionado < 0 || indiceSelecionado >= registros.length) {
                mostrarStatus('⚠️ Selecione um endereco primeiro', 'info');
                return;
            }

            enderecoFiltro = registros[indiceSelecionado].endereco;
            modoFiltro = true;
            indiceSelecionado = -1;

            const total = dadosCSV.filter(r => r.endereco === enderecoFiltro).length;
            mostrarStatus('🔍 ' + total + ' registro(s) com endereco: ' + enderecoFiltro, 'info');
            renderizarTabela();
        }

        // ==========================================
        // INICIALIZACAO
        // ==========================================
        window.onload = async function() {
            await carregarCSV();
            carregarFirebase();
            renderizarTabela();
        };
    </script>
</body>
</html>
