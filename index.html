<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Revisita</title>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* ============================================
        TELA DE LOGIN
        ============================================ */
        #loginScreen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            z-index: 10000;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #loginScreen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 40px 35px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
        }

        .login-box h1 {
            font-size: 22px;
            color: #fff;
            margin-bottom: 8px;
        }

        .login-box .subtitle {
            font-size: 13px;
            color: #a0aec0;
            margin-bottom: 28px;
        }

        .login-icon {
            font-size: 56px;
            margin-bottom: 16px;
            display: block;
        }

        .login-input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.25);
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .login-input::placeholder {
            color: #8892b0;
        }

        .login-input:focus {
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.2);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(79, 172, 254, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-error {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 12px;
            min-height: 18px;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 10px;
            color: #e0e0e0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        h1 {
            text-align: center;
            color: #00d4ff;
            margin-bottom: 20px;
            font-size: 1.5rem;
            text-shadow: 0 0 10px rgba(0,212,255,0.3);
        }

        .botoes-superiores {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 18px;
            border: 2px solid #00d4ff;
            background: transparent;
            color: #00d4ff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            transition: all 0.3s ease;
            min-width: 100px;
        }

        button:hover {
            background: #00d4ff;
            color: #1a1a2e;
            box-shadow: 0 0 15px rgba(0,212,255,0.4);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: #666;
            color: #666;
        }

        button.ativo {
            background: #00d4ff;
            color: #1a1a2e;
            box-shadow: 0 0 15px rgba(0,212,255,0.6);
        }

        .territorio-area {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(0,212,255,0.08);
            border-radius: 12px;
            border: 1px solid rgba(0,212,255,0.2);
        }

        .setas {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .seta {
            width: 36px;
            height: 28px;
            font-size: 1.2rem;
            padding: 0;
            min-width: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .label-territorio {
            font-weight: bold;
            color: #00d4ff;
            font-size: 1.1rem;
        }

        #campoTerritorio {
            width: 60px;
            padding: 8px;
            font-size: 1.1rem;
            text-align: center;
            border: 2px solid #00d4ff;
            border-radius: 8px;
            background: rgba(0,0,0,0.3);
            color: #fff;
            text-transform: uppercase;
        }

        /* ========================================== */
        /* ESTILO DA TABELA - MODO PC (PADRAO)        */
        /* ========================================== */
        .tabela-container {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid rgba(0,212,255,0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            background: rgba(0,212,255,0.15);
            color: #00d4ff;
            padding: 12px 8px;
            text-align: left;
            font-weight: bold;
            border-bottom: 2px solid #00d4ff;
        }

        tbody td {
            padding: 10px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            vertical-align: middle;
        }

        tbody tr { transition: background 0.2s; }
        tbody tr:hover { background: rgba(0,212,255,0.05); }
        tbody tr.selecionado {
            background: rgba(0,212,255,0.15);
            border-left: 3px solid #00d4ff;
        }

        .checkbox-selecao {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: #00d4ff;
        }

        /* Checkbox mobile: escondido no PC */
        .checkbox-mobile {
            display: none;
        }

        /* Checkbox PC: visivel no PC */
        .checkbox-pc {
            display: inline-block;
        }

        .input-edicao {
            width: 100%;
            padding: 6px;
            border: 2px solid #00d4ff;
            border-radius: 6px;
            background: rgba(0,0,0,0.4);
            color: #fff;
            font-size: 0.9rem;
        }

        .texto-celula { color: #e0e0e0; }

        /* ========================================== */
        /* MODO CELULAR - CARDS EMPILHADOS            */
        /* ========================================== */
        @media (max-width: 600px) {
            /* Esconde o cabecalho da tabela no celular */
            thead {
                display: none;
            }

            /* Cada linha vira um card compacto */
            tbody tr {
                display: block;
                margin-bottom: 6px;          /* era 16px;  DISTANCIA MAIOR entre cards */
                padding: 8px 10px;            /* PADDING MENOR (mais estreito) */
                background: rgba(255,255,255,0.05);
                border-radius: 10px;
                border: 1px solid rgba(0,212,255,0.15);
                border-left: 3px solid transparent;
            }

            tbody tr.selecionado {
                border-left: 3px solid #00d4ff;
                background: rgba(0,212,255,0.1);
            }

            /* Cada celula vira uma linha dentro do card */
            tbody td {
                display: flex;
                align-items: center;
                padding: 2px 0;               /* era  3px 0;  MENOR padding vertical */
                font-size: 0.85rem;           /* FONTE MENOR */
                border-bottom: none;
            }

            tbody td:last-child {
                border-bottom: none;
            }

            /* ========================================== */
            /* CHECKBOX + TERRITORIO NA MESMA LINHA       */
            /* ========================================== */
            /* Esconde a celula do checkbox sozinha (vai junto com territorio) */
            td:first-child {
                display: none;
            }

            /* Territorio: checkbox + texto lado a lado */
            td:nth-child(2) {
                display: flex;
                align-items: center;
                gap: 2px;                     /* era   8px;  espaco entre checkbox e texto */
                padding-top: 2px;
                padding-bottom: 4px;
                border-bottom: 1px solid rgba(0,212,255,0.1);
                margin-bottom: 2px;
            }

            /* Remove o rotulo "Territorio:" pois ja esta implicito */
            td:nth-child(2)::before {
                content: "Terr.: "; font-size: 0.8rem; color: #00d4ff; font-weight: bold  ;
            }

            /* Adiciona rotulos antes dos outros campos */
            td:nth-child(3)::before { content: "End.:    "; font-size: 0.8rem; }
            td:nth-child(4)::before { content: "Nºs🔢  "; font-size: 0.8rem; }
            td:nth-child(5)::before { content: "Obs. :📝  "; font-size: 0.8rem; }

            /* Ajusta inputs no modo edicao */
            .input-edicao {
                flex: 1;
                margin-left: 6px;
                padding: 4px 6px;
                font-size: 0.85rem;
            }

            .texto-celula {
                flex: 1;
                margin-left: 6px;
                word-break: break-word;
            }

            /* No mobile: esconde checkbox do PC, mostra o da celula de territorio */
            .checkbox-pc {
                display: none;
            }

            .checkbox-mobile {
                display: inline-block;
                width: 20px;
                height: 20px;
                flex-shrink: 0;
                margin-right: 4px;
            }

            /* Checkbox dentro da celula de territorio */
            .checkbox-selecao {
                width: 20px;
                height: 20px;
                flex-shrink: 0;
            }

            /* Destaque do territorio */
            td:nth-child(2) .texto-celula {
                color: #00d4ff;
                font-weight: bold;
                font-size: 0.9rem;
            }
        }

        .status {
            text-align: center;
            padding: 10px;
            margin-top: 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
        }
        .status.sucesso { background: rgba(0,255,136,0.15); color: #00ff88; border: 1px solid rgba(0,255,136,0.3); display: block; }
        .status.erro { background: rgba(255,68,68,0.15); color: #ff4444; border: 1px solid rgba(255,68,68,0.3); display: block; }
        .status.info { background: rgba(0,212,255,0.15); color: #00d4ff; border: 1px solid rgba(0,212,255,0.3); display: block; }

        .info {
            text-align: center;
            margin-top: 15px;
            font-size: 0.8rem;
            color: #888;
        }

        .encoding-info {
            text-align: center;
            font-size: 0.75rem;
            color: #666;
            margin-top: 5px;
        }

        @media (max-width: 600px) {
            .container { padding: 10px; }
            h1 { font-size: 1.2rem; }
            button { padding: 8px 12px; font-size: 0.8rem; min-width: 80px; }
            .botoes-superiores { gap: 5px; }
            #campoTerritorio { width: 50px; font-size: 1rem; }
        }
    </style>

<body>
    <!-- ============================================
     TELA DE LOGIN
     ============================================ -->
    <div id="loginScreen">
        <div class="login-box">
            <span class="login-icon">🗺️</span>
            <h1>Bem-vindo(a) ao aplicatio de "não em casa & revisita" !</h1>
            <p class="subtitle">Sistema de Revisitas v3.0</p>
            <input type="text" id="loginName" class="login-input" placeholder="Seu nome" autocomplete="off">
            <input type="password" id="loginPass" class="login-input" placeholder="Senha de acesso" autocomplete="off">
            <button class="login-btn" onclick="doLogin()">Entrar</button>
            <div class="login-error" id="loginError"></div>
        </div>
    </div>

    <div class="container">
        <div class="top-bar-header">
            <h1>Atenção <span class="user-badge" id="userBadge">Usuário</span>, Controle "não em casa & Revisita" </h1>
        </div>

        <div class="botoes-superiores">
            <button id="btnInserir" onclick="inserirRegistro()">➕ INSERIR</button>
            <button id="btnEditar" onclick="editarRegistro()">✏️ EDITAR</button>
            <button id="btnGravar" onclick="gravarRegistro()">💾 GRAVAR</button>
            <button id="btnFiltrar" onclick="filtrarEndereco()">🔍 Filtrar endereço</button>
            <button id="btnExcluir" onclick="excluirRegistro()">🗑️ EXCLUIR</button>
        </div>

        <div class="territorio-area">
            <div class="setas">
                <button class="seta" onclick="mudarTerritorio(1)" title="Próximo">▲</button>
                <button class="seta" onclick="mudarTerritorio(-1)" title="Anterior">▼</button>
            </div>
            <span class="label-territorio">territorio</span>
            <input type="text" id="campoTerritorio" value="" maxlength="3" 
                   onchange="carregarTerritorio()" placeholder="1A">
        </div>

        <!-- ========================================== -->
        <!-- TABELA - MODO PC: VISUAL NORMAL            -->
        <!-- TABELA - MODO CELULAR: CARDS EMPILHADOS    -->
        <!-- ========================================== -->
        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th style="width:40px;">☑️</th>
                        <th style="width:60px;">Terr.</th>
                        <th>Endereço</th>
                        <th style="width:100px;">Números</th>
                        <th>Observações</th>
                    </tr>
                </thead>
                <tbody id="corpoTabela"></tbody>
            </table>
        </div>

        <div id="statusMsg" class="status"></div>
        <div class="encoding-info" id="encodingInfo"></div>
        <div class="info">
            <p>Dados salvos via Firebase • Máx. 60 caracteres •</p>
        </div>
    </div>

    <script>
        // =======================================
        // CONFIGURACAO DO FIREBASE
        // =======================================
        const firebaseConfig = {
            apiKey: "AIzaSyAF4nstd0eWvodzEabCjvw-G6yUgMMJi04",
            authDomain: "nao-em-casa.firebaseapp.com",
            databaseURL: "https://nao-em-casa-default-rtdb.firebaseio.com",
            projectId: "nao-em-casa",
            storageBucket: "nao-em-casa.firebasestorage.app",
            messagingSenderId: "403981926361",
            appId: "1:403981926361:web:875c3a0eb93dff49e6e3c8"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const revisitasRef = db.ref('revisitas');

        // ==========================================
        // VARIAVEIS GLOBAIS
        // ==========================================
        let dadosCSV = [];
        let territorios = [];
        let dadosFirebase = {};
        let territorioAtual = "";
        let indiceSelecionado = -1;
        let modoEdicao = false;
        let modoFiltro = false;
        let enderecoFiltro = "";
        let encodingDetectado = "UTF-8";

        // ═══════════════════════════════════════════════════════════════════
        // LOGIN
        // ═══════════════════════════════════════════════════════════════════
        const LOGIN_PASSWORD = "ncasa8";
        let currentUser = null;

        function doLogin() {
            const name = document.getElementById('loginName').value.trim();
            const pass = document.getElementById('loginPass').value;
            const errorEl = document.getElementById('loginError');

            if (!name) {
                errorEl.textContent = "Por favor, digite seu nome.";
                return;
            }
            if (pass !== LOGIN_PASSWORD) {
                errorEl.textContent = "Senha incorreta. Tente novamente.";
                document.getElementById('loginPass').value = '';
                return;
            }

            currentUser = name;
            document.getElementById('userBadge').textContent = name;
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('appContainer').classList.add('active');

            // Inicializa o app após login
            setTimeout(initApp, 500);
        }

        // Enter no login
        document.getElementById('loginPass').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') doLogin();
        });
        document.getElementById('loginName').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') document.getElementById('loginPass').focus();
        });

        // ==========================================
        // FUNCAO: MOSTRAR MENSAGEM
        // ==========================================
        function mostrarStatus(msg, tipo) {
            const el = document.getElementById('statusMsg');
            el.textContent = msg;
            el.className = 'status ' + tipo;
            setTimeout(() => { el.className = 'status'; }, 4000);
        }

        // FUNCAO: DETECTAR ENCODING DO TEXTO:UTF-8 ou 1252 retirado, porque não funciona bem no navegador
        //   =======      FUNCAO: CARREGAR CSV COM DETECCAO DE ENCODING
        // Lê o arquivo CSV e cria a lista de territórios automaticamente
        async function carregarCSV() {
            try {
                const resposta = await fetch('Revisita4.csv');
                const texto = await resposta.text();
                const linhas = texto.trim().split('\n');

                // Limpa os arrays
                dadosCSV = [];
                const territoriosTemp = new Set(); // Set = lista sem repetições

                // Pula a primeira linha (cabeçalho)
                for (let i = 1; i < linhas.length; i++) {
                    const partes = linhas[i].split(',');
                    if (partes.length >= 2) {
                        const terr = (partes[0] || '').trim().toUpperCase();
                        const end = (partes[1] || '').trim();
                        const num = (partes[2] || '').trim();
                        const obs = (partes[3] || '').trim();

                        // Adiciona ao array de dados
                        dadosCSV.push({
                            id: i - 1,
                            territorio: terr,
                            endereco: end,
                            numeros: num,
                            obs: obs
                        });

                        // Adiciona o território ao Set (evita duplicatas)
                        if (terr) territoriosTemp.add(terr);
                    }
                }

                territorios = Array.from(territoriosTemp).sort((a, b) => {
                    const numA = parseInt(a.match(/\d+/)?.[0] || 0);
                    const numB = parseInt(b.match(/\d+/)?.[0] || 0);
                    const letraA = a.match(/[A-Z]+/)?.[0] || '';
                    const letraB = b.match(/[A-Z]+/)?.[0] || '';
                    if (numA !== numB) return numA - numB;
                    return letraA.localeCompare(letraB);
                });

                console.log('CSV carregado:', dadosCSV.length, 'registros');
                console.log('Territórios encontrados:', territorios);

                document.getElementById('encodingInfo').textContent = 
                    'Encoding detectado: ' + encodingDetectado + ' | ' + dadosCSV.length + ' registros | ' + territorios.length + ' territorios';

                if (territorios.length > 0) {
                    territorioAtual = territorios[0];
                    document.getElementById('campoTerritorio').value = territorioAtual;
                }

                mostrarStatus('✅ CSV carregado (' + encodingDetectado + '): ' + dadosCSV.length + ' registros', 'sucesso');

            } catch (erro) {
                console.error('Erro ao carregar CSV:', erro);
                mostrarStatus('❌ Erro ao carregar Revisita4.csv', 'erro');
            }
        }

        // ==========================================
        // FUNCAO AUXILIAR: Parse de linha CSV
        // ==========================================
        function parseCSVLine(linha) {
            const resultado = [];
            let atual = '';
            let dentroAspas = false;

            for (let i = 0; i < linha.length; i++) {
                const char = linha[i];
                const proximo = linha[i + 1];

                if (char === '"') {
                    if (dentroAspas && proximo === '"') {
                        atual += '"';
                        i++;
                    } else {
                        dentroAspas = !dentroAspas;
                    }
                } else if (char === ',' && !dentroAspas) {
                    resultado.push(atual.trim());
                    atual = '';
                } else {
                    atual += char;
                }
            }
            resultado.push(atual.trim());
            return resultado;
        }

        // ==========================================
        // CARREGAR DADOS DO FIREBASE
        // ==========================================
        function carregarFirebase() {
            revisitasRef.on('value', (snapshot) => {
                dadosFirebase = snapshot.val() || {};
                renderizarTabela();
            }, (erro) => {
                console.error('Erro Firebase:', erro);
                mostrarStatus('❌ Erro de conexao com Firebase', 'erro');
            });
        }

        // ==========================================
        // FUNCAO AUXILIAR: Criar chave do Firebase
        // ==========================================
        function criarChave(territorio, endereco) {
            return (territorio + '_' + endereco).replace(/[.#$\[\]]/g, '_');
        }

        // ==========================================
        // RENDERIZAR TABELA
        // ==========================================
        function renderizarTabela() {
            const corpo = document.getElementById('corpoTabela');
            corpo.innerHTML = '';

            let registros = [];

            if (modoFiltro) {
                registros = dadosCSV.filter(r => r.endereco === enderecoFiltro);
            } else {
                registros = dadosCSV.filter(r => r.territorio === territorioAtual);
            }

            if (registros.length === 0) {
                corpo.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:20px;color:#888;">Nenhum registro encontrado</td></tr>';
                return;
            }

            registros.forEach((reg, idx) => {
                const chave = criarChave(reg.territorio, reg.endereco);
                const dadosFB = dadosFirebase[chave] || {};

                const numeros = dadosFB.numeros !== undefined ? dadosFB.numeros : reg.numeros;
                const obs = dadosFB.obs !== undefined ? dadosFB.obs : reg.obs;

                const tr = document.createElement('tr');
                tr.id = 'linha_' + idx;
                if (idx === indiceSelecionado) tr.classList.add('selecionado');
                if (modoFiltro) tr.classList.add('modo-filtro');

                // Checkbox (coluna 1 - visivel no PC, escondido no mobile)
                const tdCheck = document.createElement('td');
                tdCheck.className = 'coluna-checkbox';
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'checkbox-selecao checkbox-pc';
                checkbox.checked = (idx === indiceSelecionado);
                checkbox.onclick = () => selecionarLinha(idx);
                tdCheck.appendChild(checkbox);
                tr.appendChild(tdCheck);

                // Territorio (com checkbox embutido para mobile)
                const tdTerr = document.createElement('td');
                tdTerr.className = 'coluna-territorio';

                // Checkbox para mobile (dentro da celula de territorio)
                const checkboxMobile = document.createElement('input');
                checkboxMobile.type = 'checkbox';
                checkboxMobile.className = 'checkbox-selecao checkbox-mobile';
                checkboxMobile.checked = (idx === indiceSelecionado);
                checkboxMobile.onclick = () => selecionarLinha(idx);
                tdTerr.appendChild(checkboxMobile);

                // Texto do territorio
                const spanTerr = document.createElement('span');
                spanTerr.className = 'texto-celula';
                spanTerr.textContent = reg.territorio;
                tdTerr.appendChild(spanTerr);

                tr.appendChild(tdTerr);

                // Endereco
                const tdEnd = document.createElement('td');
                tdEnd.textContent = reg.endereco;
                tr.appendChild(tdEnd);

                // Numeros
                const tdNum = document.createElement('td');
                if (modoEdicao && idx === indiceSelecionado) {
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'input-edicao';
                    input.value = numeros;
                    input.maxLength = 60;
                    input.id = 'inputNumeros';
                    tdNum.appendChild(input);
                } else {
                    const span = document.createElement('span');
                    span.className = 'texto-celula';
                    span.textContent = numeros;
                    tdNum.appendChild(span);
                }
                tr.appendChild(tdNum);

                // Observacoes
                const tdObs = document.createElement('td');
                if (modoEdicao && idx === indiceSelecionado) {
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'input-edicao';
                    input.value = obs;
                    input.maxLength = 60;
                    input.id = 'inputObs';
                    tdObs.appendChild(input);
                } else {
                    const span = document.createElement('span');
                    span.className = 'texto-celula';
                    span.textContent = obs;
                    tdObs.appendChild(span);
                }
                tr.appendChild(tdObs);

                corpo.appendChild(tr);
            });
        }

        // ==========================================
        // SELECIONAR LINHA
        // ==========================================
        function selecionarLinha(idx) {
            indiceSelecionado = idx;
            modoEdicao = false;
            document.getElementById('btnInserir').classList.remove('ativo');
            document.getElementById('btnEditar').classList.remove('ativo');
            renderizarTabela();
        }

        // ==========================================
        // MUDAR TERRITORIO (SETAS)
        // ==========================================
        function mudarTerritorio(direcao) {
            modoFiltro = false;
            const idxAtual = territorios.indexOf(territorioAtual);
            let novoIdx = idxAtual + direcao;
            if (novoIdx < 0) novoIdx = 0;
            if (novoIdx >= territorios.length) novoIdx = territorios.length - 1;
            territorioAtual = territorios[novoIdx];
            indiceSelecionado = -1;
            document.getElementById('campoTerritorio').value = territorioAtual;
            renderizarTabela();
        }

        // ==========================================
        // CARREGAR TERRITORIO DIGITADO
        // ==========================================
        function carregarTerritorio() {
            modoFiltro = false;
            const valor = document.getElementById('campoTerritorio').value.trim().toUpperCase();
            if (territorios.includes(valor)) {
                territorioAtual = valor;
                indiceSelecionado = -1;
                renderizarTabela();
            } else {
                mostrarStatus('⚠️ Territorio invalido. Disponiveis: ' + territorios.join(', '), 'erro');
                document.getElementById('campoTerritorio').value = territorioAtual;
            }
        }

        // ==========================================
        // INSERIR REGISTRO
        // ==========================================
        function inserirRegistro() {
            if (modoFiltro) {
                mostrarStatus('⚠️ Saia do modo filtro primeiro', 'info');
                return;
            }

            const registros = dadosCSV.filter(r => r.territorio === territorioAtual);
            if (indiceSelecionado < 0 || indiceSelecionado >= registros.length) {
                mostrarStatus('⚠️ Selecione um endereco primeiro (clique no ☑️)', 'info');
                return;
            }

            modoEdicao = true;
            document.getElementById('btnInserir').classList.add('ativo');
            document.getElementById('btnEditar').classList.add('ativo');
            renderizarTabela();
            mostrarStatus('✏️ Modo INSERIR ativo. Adicione caracteres aos campos e clique em GRAVAR', 'info');
        }

        // ==========================================
        // EDITAR REGISTRO
        // ==========================================
        function editarRegistro() {
            const registros = modoFiltro 
                ? dadosCSV.filter(r => r.endereco === enderecoFiltro)
                : dadosCSV.filter(r => r.territorio === territorioAtual);

            if (indiceSelecionado < 0 || indiceSelecionado >= registros.length) {
                mostrarStatus('⚠️ Selecione um endereco primeiro', 'info');
                return;
            }

            modoEdicao = true;
            document.getElementById('btnInserir').classList.add('ativo');
            document.getElementById('btnEditar').classList.add('ativo');
            renderizarTabela();
            mostrarStatus('✏️ Modo EDITAR ativo. Altere os campos e clique em GRAVAR', 'info');
        }

        // ==========================================
        // GRAVAR REGISTRO
        // ==========================================
        function gravarRegistro() {
            if (!modoEdicao) {
                mostrarStatus('⚠️ Clique em INSERIR ou EDITAR primeiro', 'info');
                return;
            }

            const registros = modoFiltro 
                ? dadosCSV.filter(r => r.endereco === enderecoFiltro)
                : dadosCSV.filter(r => r.territorio === territorioAtual);

            const reg = registros[indiceSelecionado];
            const chave = criarChave(reg.territorio, reg.endereco);

            const numeros = document.getElementById('inputNumeros').value.trim();
            const obs = document.getElementById('inputObs').value.trim();

            if (numeros.length > 60 || obs.length > 60) {
                mostrarStatus('⚠️ Maximo 60 caracteres por campo!', 'erro');
                return;
            }

            revisitasRef.child(chave).set({
                territorio: reg.territorio,
                endereco: reg.endereco,
                numeros: numeros,
                obs: obs,
                data: new Date().toISOString()
            }).then(() => {
                modoEdicao = false;
                document.getElementById('btnInserir').classList.remove('ativo');
                document.getElementById('btnEditar').classList.remove('ativo');
                renderizarTabela();  // ← ATUALIZA A TELA: campos voltam a ser texto (não input)
                mostrarStatus('💾 Dados gravados com sucesso!', 'sucesso');
            }).catch(erro => {
                mostrarStatus('❌ Erro ao gravar: ' + erro.message, 'erro');
            });
        }

        // ==========================================
        // EXCLUIR REGISTRO
        // ==========================================
        function excluirRegistro() {
            const registros = modoFiltro 
                ? dadosCSV.filter(r => r.endereco === enderecoFiltro)
                : dadosCSV.filter(r => r.territorio === territorioAtual);

            if (indiceSelecionado < 0 || indiceSelecionado >= registros.length) {
                mostrarStatus('⚠️ Selecione um endereco primeiro', 'info');
                return;
            }

            const reg = registros[indiceSelecionado];
            const chave = criarChave(reg.territorio, reg.endereco);

            if (!confirm('Tem certeza que deseja limpar os campos Numeros e Observacoes?')) {
                return;
            }

            revisitasRef.child(chave).set({
                territorio: reg.territorio,
                endereco: reg.endereco,
                numeros: '',
                obs: '',
                data: new Date().toISOString()
            }).then(() => {
                mostrarStatus('🗑️ Campos excluidos!', 'sucesso');
            }).catch(erro => {
                mostrarStatus('❌ Erro: ' + erro.message, 'erro');
            });
        }

        // ==========================================
        // FILTRAR ENDERECO
        // ==========================================
        function filtrarEndereco() {
            const registros = dadosCSV.filter(r => r.territorio === territorioAtual);

            if (indiceSelecionado < 0 || indiceSelecionado >= registros.length) {
                mostrarStatus('⚠️ Selecione um endereco primeiro', 'info');
                return;
            }

            enderecoFiltro = registros[indiceSelecionado].endereco;
            modoFiltro = true;
            indiceSelecionado = -1;

            const total = dadosCSV.filter(r => r.endereco === enderecoFiltro).length;
            mostrarStatus('🔍 ' + total + ' registro(s) com endereco: ' + enderecoFiltro, 'info');
            renderizarTabela();
        }

        // ==========================================
        // INICIALIZACAO
        // ==========================================
        window.onload = async function() {
            await carregarCSV();
            carregarFirebase();
            renderizarTabela();
        };
    </script>
</body>
</html>
