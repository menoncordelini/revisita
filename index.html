<!DOCTYPE html>
<html lang="pt-BR">
<head>
        <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Revisita</title>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* ==== TELA DE LOGIN ==== */
        #loginScreen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            z-index: 10000;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #loginScreen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 40px 35px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
        }

        .login-box h1 {
            font-size: 22px;
            color: #fff;
            margin-bottom: 8px;
        }

        .login-box .subtitle {
            font-size: 13px;
            color: #a0aec0;
            margin-bottom: 28px;
        }

        .login-icon {
            font-size: 56px;
            margin-bottom: 16px;
            display: block;
        }

        .login-input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.25);
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .login-input::placeholder { color: #8892b0; }

        .login-input:focus {
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.2);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(79, 172, 254, 0.4);
        }

        .login-btn:active { transform: translateY(0); }

        .login-error {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 12px;
            min-height: 18px;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 10px;
            color: #e0e0e0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        h1 {
            text-align: center;
            color: #00d4ff;
            margin-bottom: 20px;
            font-size: 1.5rem;
            text-shadow: 0 0 10px rgba(0,212,255,0.3);
        }

        .botoes-superiores {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 18px;
            border: 2px solid #00d4ff;
            background: transparent;
            color: #00d4ff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            transition: all 0.3s ease;
            min-width: 100px;
        }

        button:hover {
            background: #00d4ff;
            color: #1a1a2e;
            box-shadow: 0 0 15px rgba(0,212,255,0.4);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: #666;
            color: #666;
        }

        button.ativo {
            background: #00d4ff;
            color: #1a1a2e;
            box-shadow: 0 0 15px rgba(0,212,255,0.6);
        }

        /* ==== ÁREA DO TERRITÓRIO COM SETAS ==== */
        .territorio-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(0,212,255,0.08);
            border-radius: 12px;
            border: 1px solid rgba(0,212,255,0.2);
        }

        .seta-btn {
            width: 40px;
            height: 40px;
            font-size: 1.5rem;
            padding: 0;
            min-width: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .seta-esquerda { order: 1; }
        .territorio-info { order: 2; display: flex; align-items: center; gap: 10px; }
        .seta-direita { order: 3; }

        .label-territorio {
            font-weight: bold;
            color: #00d4ff;
            font-size: 1.1rem;
        }

        #campoTerritorio {
            width: 60px;
            padding: 8px;
            font-size: 1.1rem;
            text-align: center;
            border: 2px solid #00d4ff;
            border-radius: 8px;
            background: rgba(0,0,0,0.3);
            color: #fff;
            text-transform: uppercase;
        }

        /* ==== CORPO CENTRAL - FACES DA QUADRA (3 LINHAS) ==== */
        .faces-container {
            max-height: calc(100vh - 320px);
            overflow-y: auto;
            overflow-x: hidden;
            border-radius: 12px;
            border: 1px solid rgba(0,212,255,0.2);
            padding: 10px;
        }

        .faces-container::-webkit-scrollbar { width: 8px; }
        .faces-container::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 4px; }
        .faces-container::-webkit-scrollbar-thumb { background: #00d4ff; border-radius: 4px; }
        .faces-container::-webkit-scrollbar-thumb:hover { background: #00b8d4; }

        .face-quadra {
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid rgba(0,212,255,0.15);
            overflow: hidden;
        }

        .face-quadra:last-child { margin-bottom: 0; }

        /* LINHA 1: Checkbox + Território + Endereço */
        .face-linha1 {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            background: rgba(0,212,255,0.1);
            border-bottom: 1px solid rgba(0,212,255,0.2);
        }

        .face-checkbox {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: #00d4ff;
            flex-shrink: 0;
        }

        .face-territorio {
            background: #00d4ff;
            color: #1a1a2e;
            font-weight: bold;
            font-size: 1rem;
            padding: 4px 10px;
            border-radius: 6px;
            min-width: 45px;
            text-align: center;
            flex-shrink: 0;
        }

        .face-endereco {
            color: #e4eef0;
            font-weight: bold;
            font-size: 1.4rem;
            flex: 1;
            text-align: center;
        }

        /* LINHA 2: Não em casa */
        .face-linha2 {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        /* LINHA 3: Observações */
        .face-linha3 {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 15px;
        }

        .face-label {
            color: #00d4ff;
            font-weight: bold;
            font-size: 0.9rem;
            min-width: 100px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .face-input {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid rgba(0,212,255,0.3);
            border-radius: 6px;
            background: rgba(0,0,0,0.3);
            color: #fff;
            font-size: 0.9rem;
            font-family: 'Courier New', monospace;
            letter-spacing: 0.5px;
            min-width: 0;
        }

        .face-input:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 8px rgba(0,212,255,0.3);
        }

        .face-texto {
            flex: 1;
            padding: 8px 10px;
            color: #e0e0e0;
            font-size: 0.9rem;
            font-family: 'Courier New', monospace;
            letter-spacing: 0.5px;
            word-break: break-all;
            min-height: 35px;
            background: rgba(0,0,0,0.1);
            border-radius: 6px;
        }

        .face-quadra.selecionada {
            border-color: #00d4ff;
            box-shadow: 0 0 15px rgba(0,212,255,0.2);
        }

        /* ==== RESPONSIVO ==== */
        @media (max-width: 600px) {
            .container { padding: 10px; }
            h1 { font-size: 1.2rem; }
            button { padding: 8px 12px; font-size: 0.8rem; min-width: 80px; }
            .botoes-superiores { gap: 5px; }
            #campoTerritorio { width: 50px; font-size: 1rem; }

            .territorio-area { gap: 10px; padding: 10px; }
            .seta-btn { width: 35px; height: 35px; font-size: 1.2rem; }

            .faces-container { max-height: calc(100vh - 280px); }

            .face-linha1 { flex-wrap: wrap; gap: 8px; padding: 10px; }
            .face-territorio { font-size: 0.85rem; padding: 3px 8px; min-width: 38px; }
            .face-endereco { font-size: 0.85rem; }

            /* MANTER 3 LINHAS NO MOBILE - label e campo na mesma linha */
            .face-linha2, .face-linha3 { flex-direction: row; align-items: center; gap: 8px; padding: 8px 10px; }
            .face-label { min-width: 85px; font-size: 0.75rem; }
            .face-input, .face-texto { flex: 1; width: auto; font-size: 0.75rem; padding: 6px 8px; min-width: 0; }
        }

        .status {
            text-align: center;
            padding: 10px;
            margin-top: 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
        }
        .status.sucesso { background: rgba(0,255,136,0.15); color: #00ff88; border: 1px solid rgba(0,255,136,0.3); display: block; }
        .status.erro { background: rgba(255,68,68,0.15); color: #ff4444; border: 1px solid rgba(255,68,68,0.3); display: block; }
        .status.info { background: rgba(0,212,255,0.15); color: #00d4ff; border: 1px solid rgba(0,212,255,0.3); display: block; }

        .info {
            text-align: center;
            margin-top: 15px;
            font-size: 0.8rem;
            color: #888;
        }

        .encoding-info {
            text-align: center;
            font-size: 0.75rem;
            color: #666;
            margin-top: 5px;
        }
    </style>
<base target="_blank">

<body>
    <!-- ==== TELA DE LOGIN ==== -->
    <div id="loginScreen">
        <div class="login-box">
            <span class="login-icon">🗺️</span>
            <h1>Bem-vindo(a)!</h1>
            <p class="subtitle">Sistema de Revisitas v5.3</p>
            <input type="text" id="loginName" class="login-input" placeholder="Seu nome" autocomplete="off">
            <input type="password" id="loginPass" class="login-input" placeholder="Senha de acesso" autocomplete="off">
            <button class="login-btn" onclick="doLogin()">Entrar</button>
            <div class="login-error" id="loginError"></div>
        </div>
    </div>

    <div class="container" id="appContainer">
        <div class="top-bar-header">
            <h1>Atenção <span class="user-badge" id="userBadge">Usuário</span>, Controle "não em casa & Revisita"</h1>
        </div>

        <div class="botoes-superiores">
            <button id="btnEditar" onclick="editarRegistro()">✏️ Editar</button>
            <button id="btnGravar" onclick="gravarRegistro()">💾 GRAVAR</button>
            <button id="btnFiltrar" onclick="filtrarEndereco()">🔍 Filtrar</button>
            <button id="btnExcluir" onclick="excluirRegistro()">🗑️ Excluir</button>
        </div>

        <!-- ==== ÁREA DO TERRITÓRIO COM SETAS ==== -->
        <div class="territorio-area">
            <button class="seta-btn seta-esquerda" onclick="mudarTerritorio(-1)" title="Território anterior">−</button>
            <div class="territorio-info">
                <span class="label-territorio">Território</span>
                <input type="text" id="campoTerritorio" value="" maxlength="3" 
                       onchange="carregarTerritorio()" placeholder="1A">
            </div>
            <button class="seta-btn seta-direita" onclick="mudarTerritorio(1)" title="Próximo território">+</button>
        </div>

        <!-- ==== CORPO CENTRAL - FACES DA QUADRA (3 LINHAS CADA) ==== -->
        <div class="faces-container" id="facesContainer">
            <!-- As faces serão renderizadas aqui via JavaScript -->
        </div>

        <div id="statusMsg" class="status"></div>
        <div class="encoding-info" id="encodingInfo"></div>
        <div class="info">
            <p>Dados gravados via Firebase • Máx. 80 caracteres por campo</p>
        </div>
    </div>

    <script>
        // ==== CONFIGURAÇÃO DO FIREBASE ====
        const firebaseConfig = {
            apiKey: "AIzaSyAF4nstd0eWvodzEabCjvw-G6yUgMMJi04",
            authDomain: "nao-em-casa.firebaseapp.com",
            databaseURL: "https://nao-em-casa-default-rtdb.firebaseio.com",
            projectId: "nao-em-casa",
            storageBucket: "nao-em-casa.firebasestorage.app",
            messagingSenderId: "403981926361",
            appId: "1:403981926361:web:875c3a0eb93dff49e6e3c8"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const revisitasRef = db.ref('revisitas');

        // ==== VARIÁVEIS GLOBAIS ====
        let dadosCSV = [];
        let territorios = [];
        let dadosFirebase = {};
        let territorioAtual = "";
        let indiceSelecionado = -1;
        let modoEdicao = false;
        let modoFiltro = false;
        let enderecoFiltro = "";

        const LOGIN_PASSWORD = "n8";
        let currentUser = null;

        // ==== LOGIN ====
        function doLogin() {
            const name = document.getElementById('loginName').value.trim();
            const pass = document.getElementById('loginPass').value;
            const errorEl = document.getElementById('loginError');

            if (!name) {
                errorEl.textContent = "Por favor, digite seu nome.";
                return;
            }
            if (pass !== LOGIN_PASSWORD) {
                errorEl.textContent = "Senha incorreta. Tente novamente.";
                document.getElementById('loginPass').value = '';
                return;
            }

            currentUser = name;
            document.getElementById('userBadge').textContent = name;
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('appContainer').classList.add('active');

            setTimeout(initApp, 500);
        }

        document.getElementById('loginPass').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') doLogin();
        });
        document.getElementById('loginName').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') document.getElementById('loginPass').focus();
        });

        function mostrarStatus(msg, tipo) {
            const el = document.getElementById('statusMsg');
            el.textContent = msg;
            el.className = 'status ' + tipo;
            setTimeout(() => { el.className = 'status'; }, 4000);
        }

        // ==== CARREGAR CSV ====
        async function carregarCSV() {
            try {
                const resposta = await fetch('Revisita4.csv');
                const texto = await resposta.text();
                const linhas = texto.trim().split('\n');

                dadosCSV = [];
                const territoriosTemp = new Set();

                for (let i = 1; i < linhas.length; i++) {
                    const partes = parseCSVLine(linhas[i]);
                    if (partes.length >= 2) {
                        const terr = (partes[0] || '').trim().toUpperCase();
                        const end = (partes[1] || '').trim();
                        const num = (partes[2] || '').trim();
                        const obs = (partes[3] || '').trim();

                        dadosCSV.push({
                            id: i - 1,
                            territorio: terr,
                            endereco: end,
                            numeros: num,
                            obs: obs
                        });

                        if (terr) territoriosTemp.add(terr);
                    }
                }

                territorios = Array.from(territoriosTemp).sort((a, b) => {
                    const numA = parseInt(a.match(/\d+/)?.[0] || 0);
                    const numB = parseInt(b.match(/\d+/)?.[0] || 0);
                    const letraA = a.match(/[A-Z]+/)?.[0] || '';
                    const letraB = b.match(/[A-Z]+/)?.[0] || '';
                    if (numA !== numB) return numA - numB;
                    return letraA.localeCompare(letraB);
                });

                console.log('CSV carregado:', dadosCSV.length, 'registros');
                console.log('Territórios encontrados:', territorios);

                document.getElementById('encodingInfo').textContent = 
                    dadosCSV.length + ' registros | ' + territorios.length + ' territórios';

                if (territorios.length > 0) {
                    territorioAtual = territorios[0];
                    document.getElementById('campoTerritorio').value = territorioAtual;
                }

            } catch (erro) {
                console.error('Erro ao carregar CSV:', erro);
                mostrarStatus('❌ Erro ao carregar Revisita4.csv', 'erro');
            }
        }

        function parseCSVLine(linha) {
            const resultado = [];
            let atual = '';
            let dentroAspas = false;

            for (let i = 0; i < linha.length; i++) {
                const char = linha[i];
                const proximo = linha[i + 1];

                if (char === '"') {
                    if (dentroAspas && proximo === '"') {
                        atual += '"';
                        i++;
                    } else {
                        dentroAspas = !dentroAspas;
                    }
                } else if (char === ',' && !dentroAspas) {
                    resultado.push(atual.trim());
                    atual = '';
                } else {
                    atual += char;
                }
            }
            resultado.push(atual.trim());
            return resultado;
        }

        function carregarFirebase() {
            revisitasRef.on('value', (snapshot) => {
                dadosFirebase = snapshot.val() || {};
                renderizarFaces();
            }, (erro) => {
                console.error('Erro Firebase:', erro);
                mostrarStatus('❌ Erro de conexão com Firebase', 'erro');
            });
        }

        function criarChave(territorio, endereco) {
            return (territorio + '_' + endereco).replace(/[.#$\[\]]/g, '_');
        }

        // ==== RENDERIZAR FACES DA QUADRA - 3 LINHAS POR FACE ====
        function renderizarFaces() {
            const container = document.getElementById('facesContainer');
            container.innerHTML = '';

            let registros = [];

            if (modoFiltro) {
                registros = dadosCSV.filter(r => r.endereco === enderecoFiltro);
            } else {
                registros = dadosCSV.filter(r => r.territorio === territorioAtual);
            }

            if (registros.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:30px;color:#888;">Nenhum registro encontrado para este território</div>';
                return;
            }

            registros.forEach((reg, idx) => {
                const chave = criarChave(reg.territorio, reg.endereco);
                const dadosFB = dadosFirebase[chave] || {};

                const numeros = dadosFB.numeros !== undefined ? dadosFB.numeros : reg.numeros;
                const obs = dadosFB.obs !== undefined ? dadosFB.obs : reg.obs;

                const divFace = document.createElement('div');
                divFace.className = 'face-quadra';
                divFace.id = 'face_' + idx;
                if (idx === indiceSelecionado) divFace.classList.add('selecionada');

                // ========== LINHA 1: Checkbox + Território + Endereço ==========
                const divLinha1 = document.createElement('div');
                divLinha1.className = 'face-linha1';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'face-checkbox';
                checkbox.checked = (idx === indiceSelecionado);
                checkbox.onclick = () => selecionarFace(idx);
                divLinha1.appendChild(checkbox);

                const spanTerritorio = document.createElement('span');
                spanTerritorio.className = 'face-territorio';
                spanTerritorio.textContent = reg.territorio;
                divLinha1.appendChild(spanTerritorio);

                const spanEndereco = document.createElement('span');
                spanEndereco.className = 'face-endereco';
                spanEndereco.textContent = reg.endereco;
                divLinha1.appendChild(spanEndereco);

                divFace.appendChild(divLinha1);

                // ========== LINHA 2: Não em casa ==========
                const divLinha2 = document.createElement('div');
                divLinha2.className = 'face-linha2';

                const labelNaoEmCasa = document.createElement('span');
                labelNaoEmCasa.className = 'face-label';
                labelNaoEmCasa.textContent = 'Não em casa:';
                divLinha2.appendChild(labelNaoEmCasa);

                if (modoEdicao && idx === indiceSelecionado) {
                    const inputNaoEmCasa = document.createElement('input');
                    inputNaoEmCasa.type = 'text';
                    inputNaoEmCasa.className = 'face-input';
                    inputNaoEmCasa.value = numeros;
                    inputNaoEmCasa.maxLength = 80;
                    inputNaoEmCasa.id = 'inputNaoEmCasa_' + idx;
                    inputNaoEmCasa.placeholder = ' ';
                    divLinha2.appendChild(inputNaoEmCasa);
                } else {
                    const spanNaoEmCasa = document.createElement('span');
                    spanNaoEmCasa.className = 'face-texto';
                    spanNaoEmCasa.textContent = numeros || ' ';
                    divLinha2.appendChild(spanNaoEmCasa);
                }
                divFace.appendChild(divLinha2);

                // ========== LINHA 3: Observações ==========
                const divLinha3 = document.createElement('div');
                divLinha3.className = 'face-linha3';

                const labelObs = document.createElement('span');
                labelObs.className = 'face-label';
                labelObs.textContent = 'Obs.:';
                divLinha3.appendChild(labelObs);

                if (modoEdicao && idx === indiceSelecionado) {
                    const inputObs = document.createElement('input');
                    inputObs.type = 'text';
                    inputObs.className = 'face-input';
                    inputObs.value = obs;
                    inputObs.maxLength = 80;
                    inputObs.id = 'inputObs_' + idx;
                    inputObs.placeholder = '.';
                    divLinha3.appendChild(inputObs);
                } else {
                    const spanObs = document.createElement('span');
                    spanObs.className = 'face-texto';
                    spanObs.textContent = obs || ' ';
                    divLinha3.appendChild(spanObs);
                }
                divFace.appendChild(divLinha3);

                container.appendChild(divFace);
            });
        }

        function selecionarFace(idx) {
            indiceSelecionado = idx;
            modoEdicao = false;
            document.getElementById('btnEditar').classList.remove('ativo');
            renderizarFaces();
        }

        function mudarTerritorio(direcao) {
            modoFiltro = false;
            const idxAtual = territorios.indexOf(territorioAtual);
            let novoIdx = idxAtual + direcao;
            if (novoIdx < 0) novoIdx = 0;
            if (novoIdx >= territorios.length) novoIdx = territorios.length - 1;
            territorioAtual = territorios[novoIdx];
            indiceSelecionado = -1;
            document.getElementById('campoTerritorio').value = territorioAtual;
            renderizarFaces();
        }

        function carregarTerritorio() {
            modoFiltro = false;
            const valor = document.getElementById('campoTerritorio').value.trim().toUpperCase();
            if (territorios.includes(valor)) {
                territorioAtual = valor;
                indiceSelecionado = -1;
                renderizarFaces();
            } else {
                mostrarStatus('⚠️ Território inválido. Disponíveis: ' + territorios.join(', '), 'erro');
                document.getElementById('campoTerritorio').value = territorioAtual;
            }
        }

        function editarRegistro() {
            const registros = modoFiltro 
                ? dadosCSV.filter(r => r.endereco === enderecoFiltro)
                : dadosCSV.filter(r => r.territorio === territorioAtual);

            if (indiceSelecionado < 0 || indiceSelecionado >= registros.length) {
                mostrarStatus('⚠️ Selecione uma face primeiro (marque o checkbox)', 'info');
                return;
            }

            modoEdicao = true;
            document.getElementById('btnEditar').classList.add('ativo');
            renderizarFaces();
            mostrarStatus('✏️ Modo Editar ativo. Altere os campos e clique em GRAVAR', 'info');
        }

        function gravarRegistro() {
            if (!modoEdicao) {
                mostrarStatus('⚠️ Clique em Editar primeiro', 'info');
                return;
            }

            const registros = modoFiltro 
                ? dadosCSV.filter(r => r.endereco === enderecoFiltro)
                : dadosCSV.filter(r => r.territorio === territorioAtual);

            const reg = registros[indiceSelecionado];
            const chave = criarChave(reg.territorio, reg.endereco);

            const inputNaoEmCasa = document.getElementById('inputNaoEmCasa_' + indiceSelecionado);
            const inputObs = document.getElementById('inputObs_' + indiceSelecionado);

            const numeros = inputNaoEmCasa ? inputNaoEmCasa.value.trim() : '';
            const obs = inputObs ? inputObs.value.trim() : '';

            if (numeros.length > 80 || obs.length > 80) {
                mostrarStatus('⚠️ Máximo 80 caracteres por campo!', 'erro');
                return;
            }

            revisitasRef.child(chave).set({
                territorio: reg.territorio,
                endereco: reg.endereco,
                numeros: numeros,
                obs: obs,
                data: new Date().toISOString()
            }).then(() => {
                modoEdicao = false;
                document.getElementById('btnEditar').classList.remove('ativo');
                renderizarFaces();
                mostrarStatus('💾 Dados gravados com sucesso!', 'sucesso');
            }).catch(erro => {
                mostrarStatus('❌ Erro ao gravar: ' + erro.message, 'erro');
            });
        }

        function excluirRegistro() {
            const registros = modoFiltro 
                ? dadosCSV.filter(r => r.endereco === enderecoFiltro)
                : dadosCSV.filter(r => r.territorio === territorioAtual);

            if (indiceSelecionado < 0 || indiceSelecionado >= registros.length) {
                mostrarStatus('⚠️ Selecione uma face primeiro', 'info');
                return;
            }

            const reg = registros[indiceSelecionado];
            const chave = criarChave(reg.territorio, reg.endereco);

            if (!confirm('Tem certeza que deseja limpar os campos "Não em casa" e "Observações"?')) {
                return;
            }

            revisitasRef.child(chave).set({
                territorio: reg.territorio,
                endereco: reg.endereco,
                numeros: '',
                obs: '',
                data: new Date().toISOString()
            }).then(() => {
                mostrarStatus('🗑️ Campos excluídos!', 'sucesso');
            }).catch(erro => {
                mostrarStatus('❌ Erro: ' + erro.message, 'erro');
            });
        }

        function filtrarEndereco() {
            const registros = dadosCSV.filter(r => r.territorio === territorioAtual);

            if (indiceSelecionado < 0 || indiceSelecionado >= registros.length) {
                mostrarStatus('⚠️ Selecione uma face primeiro', 'info');
                return;
            }

            enderecoFiltro = registros[indiceSelecionado].endereco;
            modoFiltro = true;
            indiceSelecionado = -1;

            const total = dadosCSV.filter(r => r.endereco === enderecoFiltro).length;
            mostrarStatus('🔍 ' + total + ' registro(s) com endereço: ' + enderecoFiltro, 'info');
            renderizarFaces();
        }

        function initApp() {
            carregarCSV().then(() => {
            carregarFirebase();
            renderizarFaces();
            });
        }

        window.onload = function() {
            // Aguarda o login
        };
    </script>
</body>
</html>
